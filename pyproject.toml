[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "leakcalc"
version = "0.1.0"
description = "Reference implementations of published methods for estimating compressed-air leak repair savings"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ran Tao" }]
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
]

[tool.setuptools.packages.find]
where = ["src"]
