name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package
        run: python -m pip install .
      - name: Import the installed package (outside the source tree)
        working-directory: ${{ runner.temp }}
        run: python -c "import leakcalc; print(leakcalc.__version__, leakcalc.__file__)"
      - name: Unit tests (worked examples and behaviour)
        run: python -m unittest discover -s tests -v
      - name: Mutation check (every deliberate error must be caught)
        run: python tools/mutation_check.py
